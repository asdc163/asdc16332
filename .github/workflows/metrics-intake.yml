name: 成長數據回報

# 在每週檢視 issue 底下留言貼上數字，這裡負責解析並寫進 data/tracking.csv。
# 廣場沒有開放統計 API，這是唯一能把粉絲數與曝光帶進系統的路徑。
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    # 只處理檢視 issue、且不是機器人自己的留言
    if: >
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '每週檢視') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 解析留言並寫入追蹤表
        id: intake
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # 經環境變數傳入，避免留言內容被當成 shell 語法執行
          if printf '%s' "$COMMENT_BODY" | python -m square intake > intake.out 2> intake.err; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            cat intake.out
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            cat intake.err
          fi

      - name: 提交追蹤表
        if: steps.intake.outputs.ok == 'true'
        run: |
          git config user.name "square-content-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有變更。"
            exit 0
          fi
          git commit -m "chore(metrics): 由 issue #${{ github.event.issue.number }} 回報"
          for i in 1 2 3 4; do
            git push && break
            sleep $((2 ** i))
            git pull --rebase
          done

      - name: 回覆確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.intake.outputs.ok }}" = "true" ]; then
            BODY="$(cat intake.out)"
          else
            BODY=$'沒有解析到數字。可以這樣寫（順序不拘，中英文皆可）：\n\n```\nfollowers: 1250\nimpressions: 8400\nclicks: 96\nsignups: 4\ncommission: 23.5\n```'
          fi
          printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$BODY" \
            | gh issue comment "${{ github.event.issue.number }}" --body-file -
