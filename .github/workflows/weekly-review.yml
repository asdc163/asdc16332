name: 每週檢視

# 週日 21:30 台北（13:30 UTC），排在週報發布之後半小時。
on:
  schedule:
    - cron: "30 13 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 產生檢視報告
        run: python -m square review --out review.md

      - name: 開一則檢視 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK=$(TZ=Asia/Taipei date +%G-W%V)
          TITLE="每週檢視 $WEEK"

          # 標籤第一次執行時還不存在，先建起來（已存在就略過）
          gh label create weekly-review --color 0E8A16 \
            --description "每週績效檢視與數據回報" 2>/dev/null || true

          # 同一週重複觸發時更新既有 issue，不要洗版。
          # 標題比對要精確，避免 "每週檢視 2026-W31" 命中 "每週檢視 2026-W3"。
          EXISTING=$(gh issue list --state open --limit 50 --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          {
            cat review.md
            printf '\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file issue-body.md
            echo "已更新 issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md --label weekly-review
          fi

      - name: 把報告貼到執行摘要
        if: always()
        run: cat review.md >> "$GITHUB_STEP_SUMMARY" || true
